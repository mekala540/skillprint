[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillprint"
version = "0.1.1"
description = "See what an agent skill pack loads and runs before you install it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mekala" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai-agents", "agent-skills", "claude-code", "cursor", "codex", "security", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
skillprint = "skillprint.cli:main"

[tool.setuptools]
packages = ["skillprint"]

[project.urls]
Homepage = "https://github.com/mekala540/skillprint"
Issues = "https://github.com/mekala540/skillprint/issues"
